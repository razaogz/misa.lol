<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>misa.lol - Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/config.js"></script>
    <script src="/js/auth.js?v=20260911-captcha"></script>
</head>
<body class="auth-page login-page auth-api-page">
    <div class="auth-container">
        <!-- Left Column -->
        <section class="auth-form-section">
            <div class="auth-header">
                <a href="/" class="logo">† misa.lol</a>
                <div class="decorative-top-right">YOUR CORNER OF THE INTERNET.</div>
            </div>

            <div class="auth-form-wrapper">
                <h1 class="auth-title">welcome back.</h1>
                <p class="auth-subtitle">your corner of the internet.</p>

                <p class="auth-message" id="auth-message" hidden></p>

                <div class="social-auth" aria-label="Social sign-in options">
                    <a class="social-auth__button social-auth__button--telegram" href="/api/v1/auth/telegram"><img src="/icons/telegram.webp" alt=""><span>Continue with Telegram</span></a>
                    <a class="social-auth__button social-auth__button--google" href="/api/v1/auth/google"><img src="/icons/google.webp" alt=""><span>Continue with Google</span></a>
                    <a class="social-auth__button social-auth__button--discord" href="/api/v1/auth/discord"><img src="/icons/discord.webp" alt=""><span>Continue with Discord</span></a>
                </div>
                <div class="auth-divider"><span>or log in with email</span></div>

                <form class="auth-form" id="login-form" method="POST" action="/api/v1/auth/login">
                    <div id="login-credentials">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" placeholder="your@email.com" required>
                            <i class="fa-regular fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Password" required>
                            <i class="fa-regular fa-eye input-icon password-toggle"></i>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="checkbox-container">
                            <input type="checkbox" name="remember">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    </div>

                    <div class="turnstile-box" id="login-turnstile-box" hidden>
                        <div id="login-turnstile" aria-label="Human verification"></div>
                    </div>
                    <div id="login-mfa-step" hidden>
                        <div class="form-group">
                            <label for="login-mfa-code">Authentication code</label>
                            <div class="input-wrapper">
                                <input type="text" id="login-mfa-code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="6">
                                <i class="fa-solid fa-shield-halved input-icon"></i>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-ivory btn-large btn-full">LOG IN</button>
                </form>

                <p class="auth-footer">
                    Don't have an account? <a href="/signup" class="crimson-link">Sign up →</a>
                </p>
            </div>

            <div class="decorative-bottom-left">
                SAME PEOPLE.<br>NEW POSSIBILITIES.
            </div>
        </section>

    </div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/js/main.js"></script>
</body>
</html>
